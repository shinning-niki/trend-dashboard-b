name: Update Trend Dashboard B

on:
  schedule:
    # UTC 10:30 = Beijing 18:30 (A股数据16:24更新，getUpdateStatus可能提前报fresh，留2h+缓冲)
    - cron: '30 10 * * *'
  # 允许手动触发
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard-b-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Fetch dashboard data
        env:
          TREND_API_KEY: ${{ secrets.TREND_API_KEY }}
        run: python dashboard/fetch_dashboard_data.py

      - name: Build dashboard
        run: python dashboard/build_dashboard.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Push dist to netlify branch
        run: |
          # Save built file before switching branches
          cp dashboard/dist/index.html /tmp/index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Switch to or create netlify branch
          git fetch origin netlify 2>/dev/null || true
          if git rev-parse --verify origin/netlify >/dev/null 2>&1; then
            git checkout -b netlify origin/netlify
          else
            git checkout --orphan netlify
          fi
          # Clean branch and deploy single file
          git rm -rf . 2>/dev/null || true
          cp /tmp/index.html .
          git add index.html
          git commit -m "deploy: $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push origin netlify --force

      - name: Report
        if: always()
        run: |
          echo "## Dashboard B Update Report" >> $GITHUB_STEP_SUMMARY
          echo "$(cat dashboard/meta.json)" >> $GITHUB_STEP_SUMMARY
          if [ -f dashboard/dist/index.html ]; then
            echo "Build OK" >> $GITHUB_STEP_SUMMARY
          else
            echo "Build FAILED" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
